<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Results summary component</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <main>
    <div class="parent_container">
      <div class="result_card">
          <h1>Your Result</h1>
          <div class="score">
            <span>76</span><p> of 100</p>
          </div>
          <h2>Great</h2>
          <p class="review">You scored higher than 65% of the people who have taken these tests.</p>
      </div>
      <div class="summary_card">
        <h3>Summary</h3>
          <article class="metric">
            <div class="metric_attribute">
              <img class="icon" src="assets/images/icon-reaction.svg" alt="Icon for reaction metric">
              <p>Reaction</p>
            </div>
            <div class="rate"><span>80</span>/100</div>
          </article>
          <article class="metric">
            <div class="metric_attribute">
              <img class="icon" src="assets/images/icon-memory.svg" alt="Icon for memory metric">
              <p>Memory</p>
            </div>
            <div class="rate"><span>92</span>/100</div>
          </article>
          <article class="metric">
            <div class="metric_attribute">
              <img class="icon" src="assets/images/icon-verbal.svg" alt="Icon for verbal metric">
              <p>Verbal</p>
            </div>
            <div class="rate"><span>61</span>/100</div>
          </article>
          <article class="metric">
            <div class="metric_attribute">
              <img class="icon" src="assets/images/icon-visual.svg" alt="Icon for visual metric">
              <p>Visual</p>
            </div>
            <div class="rate"><span>73</span>/100</div>
          </article>
          <button class="continue" type="button"> Continue</button>
      </div>
    </div>
  </main>
</body>
</html>
